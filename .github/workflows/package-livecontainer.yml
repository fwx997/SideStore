name: Package LiveContainer with current SideStore

on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-livecontainer.yml']
  workflow_dispatch:
    inputs:
      livecontainer_ref:
        description: Exact LiveContainer fork commit to build
        required: true
        type: string
      runner:
        description: macOS runner with Xcode 26.2
        required: true
        default: macos-26
        type: choice
        options:
          - macos-15-intel
          - macos-26-intel
          - macos-26

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run production Swift regression tests
        run: |
          swiftc --version
          python3 -m unittest discover -s scripts/tests -v
  package:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: fwx997/LiveContainer
          ref: ${{ inputs.livecontainer_ref || 'b983b47401103ae457640df12639fc8fe931596c' }}
          submodules: recursive
          path: LiveContainer-build
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.2'
      - name: Install build tools
        run: brew install ldid xcbeautify
      - name: Test LiveContainer callbacks and background refresh before building
        working-directory: LiveContainer-build
        run: python3 .github/tests/test_background_refresh.py --require-swift -v
      - name: Test SideStore signing, recovery, and background refresh
        run: |
          swiftc --version
          python3 -m unittest discover -s scripts/tests -v
      - name: Set SideStore version
        run: |
          VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          NORMALIZED=$(python3 scripts/ci/workflow.py compute-normalized "$VERSION" "$GITHUB_RUN_NUMBER" "$COMMIT")
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED"
          echo "SIDESTORE_VERSION=$NORMALIZED" >> "$GITHUB_ENV"
      - name: Build SideStore
        run: python3 scripts/ci/workflow.py build
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.SIDESTORE_VERSION }}.ipa
          path: SideStore.ipa
          if-no-files-found: error
      - name: Archive LiveContainer
        working-directory: LiveContainer-build
        run: |
          set -o pipefail
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 -configuration Release 2>&1 | tee build.log | xcbeautify --renderer github-actions
      - name: Test and package LiveContainer with this SideStore build
        working-directory: LiveContainer-build
        env:
          scheme: LiveContainer
          archive_path: archive
        run: |
          export SIDESTORE_IPA_PATH="$GITHUB_WORKSPACE/SideStore.ipa"
          sh .github/build_github.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer-build/LiveContainer+SideStore.ipa
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-build-logs
          path: |
            build/logs/build.log
            LiveContainer-build/build.log
