name: Package LiveContainer with current SideStore

on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-livecontainer.yml']
  workflow_dispatch:
    inputs:
      livecontainer_ref:
        description: Exact LiveContainer fork commit to build
        required: true
        type: string
      package_only:
        description: Compile and package only; device testing is performed separately
        required: false
        default: false
        type: boolean
      anisette_diagnostics:
        description: Run account-free Anisette initialization diagnostics only
        required: false
        default: false
        type: boolean
      runner:
        description: xcode-27 uses Xcode 27.2; other runners use Xcode 26.2
        required: true
        default: xcode-27
        type: choice
        options:
          - xcode-27
          - macos-15-intel
          - macos-26-intel
          - macos-26

permissions:
  contents: read

jobs:
  regressions:
    if: ${{ !inputs.package_only && !inputs.anisette_diagnostics }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run production Swift regression tests
        run: |
          swiftc --version
          python3 -m unittest discover -s scripts/tests -v
  package:
    if: ${{ !inputs.anisette_diagnostics }}
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: fwx997/LiveContainer
          ref: ${{ inputs.livecontainer_ref || 'b983b47401103ae457640df12639fc8fe931596c' }}
          submodules: recursive
          path: LiveContainer-build
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ (inputs.runner == 'xcode-27' || inputs.runner == '') && '27.2' || '26.2' }}
      - name: Install build tools
        run: brew install ldid xcbeautify
      - name: Test LiveContainer callbacks and background refresh before building
        if: ${{ !inputs.package_only }}
        working-directory: LiveContainer-build
        run: python3 .github/tests/test_background_refresh.py --require-swift -v
      - name: Test SideStore signing, recovery, and background refresh
        if: ${{ !inputs.package_only }}
        run: |
          swiftc --version
          python3 -m unittest discover -s scripts/tests -v
      - name: Set SideStore version
        run: |
          VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          NORMALIZED=$(python3 scripts/ci/workflow.py compute-normalized "$VERSION" "$GITHUB_RUN_NUMBER" "$COMMIT")
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED"
          echo "SIDESTORE_VERSION=$NORMALIZED" >> "$GITHUB_ENV"
      - name: Build SideStore
        run: python3 scripts/ci/workflow.py build
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.SIDESTORE_VERSION }}.ipa
          path: SideStore.ipa
          if-no-files-found: error
      - name: Archive LiveContainer
        working-directory: LiveContainer-build
        run: |
          set -o pipefail
          if [ -f .github/prepare_dependencies.sh ]; then
            sh .github/prepare_dependencies.sh
          fi
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 -configuration Release 2>&1 | tee build.log | xcbeautify --renderer github-actions
      - name: Package LiveContainer with this SideStore build
        working-directory: LiveContainer-build
        env:
          scheme: LiveContainer
          archive_path: archive
          LC_PACKAGE_ONLY: ${{ inputs.package_only && '1' || '0' }}
        run: |
          export SIDESTORE_IPA_PATH="$GITHUB_WORKSPACE/SideStore.ipa"
          sh .github/build_github.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer-build/LiveContainer+SideStore.ipa
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-build-logs
          path: |
            build/logs/build.log
            LiveContainer-build/build.log
  anisette-diagnostics:
    if: ${{ inputs.anisette_diagnostics }}
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mahee96/AnisetteKit
          ref: db8b41022697b6c19be8a5f01a1ce834145a2a26
          path: AnisetteKit-diagnostics
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '27.2'
      - name: Prepare the existing ODA library payload
        run: python3 scripts/diagnostics/prepare_oda.py AnisetteKit-diagnostics/DiagnosticLibraries
      - name: Run bounded initialization probes without an Apple account
        working-directory: AnisetteKit-diagnostics
        run: |
          set -o pipefail
          cp ../scripts/diagnostics/AnisetteProvisioningDiagnostics.swift Tests/AnisetteKitTests/
          export ANISETTE_DIAGNOSTIC_LIBS="$PWD/DiagnosticLibraries"
          export ANISETTE_DIAGNOSTIC_REPORT="$GITHUB_WORKSPACE/anisette-diagnostics.json"
          swift test --filter AnisetteProvisioningDiagnostics 2>&1 | tee ../anisette-diagnostics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anisette-initialization-diagnostics
          path: |
            anisette-diagnostics.json
            anisette-diagnostics.log
