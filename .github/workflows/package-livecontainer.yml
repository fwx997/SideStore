name: Package LiveContainer, SideStore, and SideInstaller

on:
  workflow_dispatch:
    inputs:
      livecontainer_ref:
        description: Exact LiveContainer fork commit to build
        required: true
        type: string
      sideinstaller_ref:
        description: Exact SideInstaller fork commit (includes the siboot bootstrap)
        required: true
        type: string
      combined_update_url:
        description: HTTPS download URL for future complete three-app updates
        required: true
        type: string
      shortcut_records:
        description: Optional public iCloud shortcut record IDs to preserve and update, separated by commas
        required: false
        default: ''
        type: string
      reuse_build_run:
        description: Reuse verified application artifacts from this run (leave empty to compile all)
        required: false
        default: ''
        type: string
      rebuild_sidestore:
        description: Reuse only SideInstaller and siboot, and test/build SideStore from this commit
        required: false
        default: false
        type: boolean
      checks_only:
        description: Run portable regressions and compile the native shortcut extension without packaging
        required: false
        default: false
        type: boolean
      package_only:
        description: Compile and package only; device testing is performed separately
        required: false
        default: false
        type: boolean
      runner:
        description: Xcode 27 for application builds; Intel is supported only when reusing both prebuilt applications
        required: true
        default: xcode-27
        type: choice
        options:
          - xcode-27
          - macos-26-intel

permissions:
  contents: read
  actions: read

jobs:
  regressions:
    if: ${{ inputs.checks_only || (!inputs.package_only && (inputs.reuse_build_run == '' || inputs.rebuild_sidestore)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        if: ${{ inputs.checks_only }}
        with:
          repository: fwx997/LiveContainer
          ref: ${{ inputs.livecontainer_ref }}
          path: LiveContainer-build
      - name: Run production Swift regression tests
        run: |
          swiftc --version
          python3 -m unittest discover -s scripts/tests -v
      - name: Companion shortcut production regressions
        if: ${{ inputs.checks_only }}
        run: python3 -m unittest discover -s LiveContainer-build/.github/tests -p 'test_sideinstaller_*.py' -v
  package:
    if: ${{ !inputs.checks_only }}
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: fwx997/LiveContainer
          ref: ${{ inputs.livecontainer_ref || 'b983b47401103ae457640df12639fc8fe931596c' }}
          submodules: recursive
          path: LiveContainer-build
      - uses: actions/checkout@v4
        with:
          repository: fwx997/SideInstaller
          ref: ${{ inputs.sideinstaller_ref }}
          path: SideInstaller-build
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ inputs.runner == 'macos-26-intel' && '26.6' || '27.2' }}
      - name: Validate the selected build environment
        env:
          SELECTED_RUNNER: ${{ inputs.runner }}
          REUSED_BUILD: ${{ inputs.reuse_build_run }}
          REBUILD_SIDESTORE: ${{ inputs.rebuild_sidestore }}
          PACKAGE_ONLY: ${{ inputs.package_only }}
        run: |
          if [ "$REBUILD_SIDESTORE" = "true" ] && { [ -z "$REUSED_BUILD" ] || [ "$PACKAGE_ONLY" = "true" ]; }; then
            echo 'Rebuilding SideStore requires a verified reuse run and its full regression tests.' >&2
            exit 1
          fi
          if [ "$SELECTED_RUNNER" = "macos-26-intel" ] && { [ -z "$REUSED_BUILD" ] || [ "$REBUILD_SIDESTORE" = "true" ]; }; then
            echo 'SideStore and SideInstaller builds use Xcode 27; Intel is for host-only repackaging.' >&2
            exit 1
          fi
      - name: Install build tools
        run: brew install ldid xcbeautify xcodegen
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ inputs.reuse_build_run == '' }}
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/cache@v4
        if: ${{ inputs.reuse_build_run == '' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SideInstaller-build/rust-core/target
            SideInstaller-build/bootstrap/target
          key: combined-apps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('SideInstaller-build/rust-core/Cargo.lock', 'SideInstaller-build/bootstrap/Cargo.lock') }}
          restore-keys: |
            combined-apps-${{ runner.os }}-${{ runner.arch }}-
      - name: Test LiveContainer callbacks and background refresh before building
        if: ${{ !inputs.package_only }}
        working-directory: LiveContainer-build
        run: |
          python3 .github/tests/test_background_refresh.py --require-swift -v
          python3 -m unittest discover -s .github/tests -p test_companion_switch.py -v
          python3 -m unittest discover -s .github/tests -p test_sideinstaller_shortcuts.py -v
          python3 -m unittest discover -s .github/tests -p test_sideinstaller_intents.py -v
      - name: Reuse exact verified application artifacts
        if: ${{ inputs.reuse_build_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_BUILD_RUN: ${{ inputs.reuse_build_run }}
          EXPECTED_SIDEINSTALLER: ${{ inputs.sideinstaller_ref }}
          REBUILD_SIDESTORE: ${{ inputs.rebuild_sidestore }}
        run: python3 scripts/reuse_combined_artifacts.py
      - name: Test SideStore signing, recovery, and background refresh
        if: ${{ !inputs.package_only && (inputs.reuse_build_run == '' || inputs.rebuild_sidestore) }}
        run: |
          swiftc --version
          python3 -m unittest discover -s scripts/tests -v
      - name: Test SideInstaller and siboot
        if: ${{ !inputs.package_only && inputs.reuse_build_run == '' }}
        working-directory: SideInstaller-build
        run: LOCKED=1 bash scripts/test-rust.sh
      - name: Build complete SideInstaller and Minis bootstrap
        if: ${{ inputs.reuse_build_run == '' }}
        working-directory: SideInstaller-build
        env:
          VERSION: 2.3.0
        run: |
          set -o pipefail
          export BUILD_NUMBER="$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          bash scripts/build-ipa.sh 2>&1 | tee sideinstaller-build.log
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.reuse_build_run == '' }}
        with:
          name: SideInstaller-and-siboot
          path: SideInstaller-build/build/SideInstaller.ipa
          if-no-files-found: error
      - name: Set SideStore version
        if: ${{ inputs.reuse_build_run == '' || inputs.rebuild_sidestore }}
        run: |
          VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          COMMIT=$(python3 scripts/ci/workflow.py commit-id)
          NORMALIZED=$(python3 scripts/ci/workflow.py compute-normalized "$VERSION" "$GITHUB_RUN_NUMBER" "$COMMIT")
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED"
          echo "SIDESTORE_VERSION=$NORMALIZED" >> "$GITHUB_ENV"
      - name: Build SideStore
        if: ${{ inputs.reuse_build_run == '' || inputs.rebuild_sidestore }}
        run: python3 scripts/ci/workflow.py build
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.reuse_build_run == '' || inputs.rebuild_sidestore }}
        with:
          name: SideStore-${{ env.SIDESTORE_VERSION }}.ipa
          path: SideStore.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.reuse_build_run != '' }}
        with:
          name: SideInstaller-and-siboot
          path: SideInstaller-build/build/SideInstaller.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.reuse_build_run != '' && !inputs.rebuild_sidestore }}
        with:
          name: SideStore-${{ env.SIDESTORE_VERSION }}.ipa
          path: SideStore.ipa
          if-no-files-found: error
      - name: Render the companion picker on iPhone and iPad
        working-directory: LiveContainer-build
        run: |
          if [ -f .github/tests/render_companion_picker.py ]; then
            python3 .github/tests/render_companion_picker.py --output build/companion-picker-preview --sidestore-ipa ../SideStore.ipa --sideinstaller-ipa ../SideInstaller-build/build/SideInstaller.ipa
          fi
      - name: Archive LiveContainer
        id: archive_host
        working-directory: LiveContainer-build
        run: |
          set -o pipefail
          if [ -f .github/prepare_dependencies.sh ]; then
            sh .github/prepare_dependencies.sh
          fi
          BUILD_NUMBER="$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          python3 .github/configure_combined_build.py --build-number "$BUILD_NUMBER"
          xcodebuild archive -archivePath archive -scheme LiveContainer -project LiveContainer.xcodeproj -sdk iphoneos -arch arm64 -configuration Release 2>&1 | tee build.log | xcbeautify --renderer github-actions
      - name: Package all three applications
        working-directory: LiveContainer-build
        env:
          scheme: LiveContainer
          archive_path: archive
          LC_PACKAGE_ONLY: ${{ inputs.package_only && '1' || '0' }}
          LC_COMBINED_UPDATE_URL: ${{ inputs.combined_update_url }}
        run: |
          export SIDESTORE_IPA_PATH="$GITHUB_WORKSPACE/SideStore.ipa"
          export SIDEINSTALLER_IPA_PATH="$GITHUB_WORKSPACE/SideInstaller-build/build/SideInstaller.ipa"
          export SIDEINSTALLER_LICENSE_PATH="$GITHUB_WORKSPACE/SideInstaller-build/LICENSE.md"
          sh .github/build_github.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LiveContainer+SideStore+SideInstaller.ipa
          path: LiveContainer-build/LiveContainer+SideStore+SideInstaller.ipa
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-build-logs
          path: |
            build/logs/build.log
            LiveContainer-build/build.log
            LiveContainer-build/build/companion-picker-preview/*.png
            LiveContainer-build/build/companion-picker-preview/*.json
            LiveContainer-build/build/companion-picker-preview/*.txt
            SideInstaller-build/sideinstaller-build.log
            reused-build.json

      - name: Prepare device-specific refresh shortcuts
        if: ${{ inputs.shortcut_records != '' }}
        env:
          SHORTCUT_RECORDS: ${{ inputs.shortcut_records }}
          MINIMUM_BUILD: ${{ steps.archive_host.outputs.build_number }}
        run: |
          python3 scripts/prepare_refresh_shortcuts.py --records "$SHORTCUT_RECORDS" --minimum-build "$MINIMUM_BUILD" --output shortcuts/unsigned
      - name: Sign with the macOS Shortcuts tool
        id: sign_shortcuts
        if: ${{ inputs.shortcut_records != '' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p shortcuts/signed
          for input in shortcuts/unsigned/*.shortcut; do
            shortcuts sign --mode anyone --input "$input" --output "shortcuts/signed/$(basename "$input")"
          done
      - name: Record optional shortcut signing outcome
        if: ${{ always() && inputs.shortcut_records != '' }}
        env:
          SIGNING_OUTCOME: ${{ steps.sign_shortcuts.outcome }}
        run: python3 scripts/record_shortcut_signing.py shortcuts "$SIGNING_OUTCOME"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.shortcut_records != '' }}
        with:
          name: personal-refresh-shortcuts
          path: shortcuts/
          if-no-files-found: error

  native_intents:
    if: ${{ inputs.checks_only }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fwx997/LiveContainer
          ref: ${{ inputs.livecontainer_ref }}
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.6'
      - name: Build native shortcut extension
        run: |
          set -o pipefail
          python3 .github/configure_combined_build.py --build-number 20261124.1
          xcodebuild -project LiveContainer.xcodeproj -target LiveContainerShared -sdk iphoneos -arch arm64 -configuration Release CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/NativeIntents" 2>&1 | tee native-shared.log
          xcodebuild -project LiveContainer.xcodeproj -target LaunchAppExtension -sdk iphoneos -arch arm64 -configuration Release CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/NativeIntents" 2>&1 | tee native-intents.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-intents-check
          path: |
            native-intents.log
            native-shared.log
            ${{ runner.temp }}/NativeIntents/LaunchAppExtension.appex/Metadata.appintents
